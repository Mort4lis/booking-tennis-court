name: booking-tennis-court

# Development dependencies only. The bot itself runs on the host via
# `make run` (or `go run ./cmd/bot serve`).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Traces sink for local development. Point BTC_TRACING_OTLP_ENDPOINT at
  # localhost:4317 and set BTC_TRACING_ENABLED=true; the UI is on :16686.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

volumes:
  pgdata:
